<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; color: #eef1f6;
    background:
      radial-gradient(700px 420px at 12% 18%, rgba(79,157,255,.30), transparent 70%),
      radial-gradient(600px 380px at 95% 95%, rgba(255,158,69,.22), transparent 70%),
      linear-gradient(135deg, #0b0f17, #121826);
    position: relative;
  }
  .left { position: absolute; left: 72px; top: 92px; width: 520px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 76px; height: 76px; }
  .brand span { font-size: 54px; font-weight: 700; letter-spacing: -0.03em; }
  h1 { font-size: 46px; line-height: 1.08; letter-spacing: -0.03em; margin: 34px 0 18px; font-weight: 700; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #4f9dff, #ff9e45); -webkit-background-clip: text; color: transparent; }
  p { font-size: 22px; color: #a3adbd; margin: 0 0 30px; line-height: 1.4; }
  .pills { display: flex; flex-wrap: wrap; gap: 10px; }
  .pills span { font-size: 17px; padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.10); color: #d5dbe5; }
  .shot { position: absolute; left: 640px; top: 70px; width: 720px; border-radius: 14px; overflow: hidden;
          box-shadow: 0 40px 90px -20px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.08); }
  .shot img { width: 100%; display: block; }
  .bar { position: absolute; left: 600px; top: 488px; width: 600px; border-radius: 12px; overflow: hidden;
         box-shadow: 0 30px 60px -15px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.10); }
  .bar img { width: 100%; display: block; }
</style></head>
<body>
  <div class="left">
    <div class="brand"><img src="../../docs/images/logo.png"><span>WinSpeed</span></div>
    <h1>Your internet speed,<br><em>right on the taskbar.</em></h1>
    <p>Free, open-source speed meter for Windows 10 &amp; 11 with speed tests, data-usage history and data-cap alerts.</p>
    <div class="pills"><span>Live meter</span><span>Speed test</span><span>Usage history</span><span>Data alerts</span><span>Free &amp; open source</span></div>
  </div>
  <div class="shot"><img src="../../docs/images/overview-dark.png"></div>
  <div class="bar"><img src="../../docs/images/taskbar-meter.png"></div>
</body></html>
